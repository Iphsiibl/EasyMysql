name: 内容勘误
about: 报告教程里的错误、失效内容或不准确的地方
title: "[勘误] "
labels: ["correction", "documentation"]
body: |
  ## 描述问题

  哪一篇的哪个部分？把标题和行号写清楚。

  ## 现在的内容 / 实际行为

  贴出你在自己环境里跑出来的**真实输出**（这一步很关键，不要省略）。

  ```text
  你的输出贴这里
  ```

  ## 你期望的正确内容

  你觉得应该是什么？如果知道原因，一并写上。

  ## 环境

  - MySQL 版本：`SELECT VERSION();` 的结果
  - 系统：Windows / macOS / Linux
  - 执行方式：Adminer 界面 / mysql 客户端
  - 仓库 commit：main 分支的最新提交

  ## 额外说明

  （可选）
